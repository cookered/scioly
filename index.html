<html>
  <head>
    <title>SCIENCE OLYMIPAD DIVISION B RULES MANUAL OR ELSE</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <style>
      iframe {
        max-height: calc(99% - 31px);
      }
      nav {
        height: 31px;
        display: flex;
        flex-wrap: nowrap;
        overflow-x: auto;
        white-space: nowrap;
      }
      .btn {
        border-bottom-left-radius: 0;
        border-bottom-right-radius: 0;
        border: 1px solid black;
        flex: 0 0 auto;
        max-height: 31px;
      }
      body {
        background: black;
      }
    </style>
  </head>
  <body>
    <nav height="5%" width="100%">
    </nav>
    <iframe src="rules.pdf" width="100%" height="95%"></iframe>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <script>
      const toc = [
          ["General Rules", 6],
          ["Event Type Descriptions", 7],
          ["Anatomy & Physiology", 8],
          ["Boomilever", 10],
          ["Botany", 16],
          ["Circuit Lab", 17],
          ["Codebusters", 19],
          ["Crime Busters", 21],
          ["Disease Detectives", 23],
          ["Dynamic Planet", 25],
          ["Elastic Launched Glider", 27],
          ["Experimental Design", 30],
          ["Food Science", 32],
          ["Heredity", 34],
          ["Hovercraft", 36],
          ["Meteorology", 40],
          ["Ping Pong Parachute", 42],
          ["Remote Sensing", 44],
          ["Rocks and Minerals", 46],
          ["2027 National Rocks & Minerals List", 49],
          ["Roller Coaster", 51],
          ["Scrambler", 54],
          ["Solar System", 60],
          ["Thermodynamics", 61],
          ["Water Quality", 64],
          ["Write It Do It", 66],
          ["Trial Event Rules", 67],
          ["Code Craze", 68],
          ["Hydraulics", 69],
          ["Protein Builders", 72],
          ["Div. B Chemistry Lab Equipment List", 74],
          ["Calculator Class Descriptions", 75],
          ["Eye Protection Guide", 76],
          ["Available Team Resources", 77],
          ["Div. B National Tournament Schedule", 79]
      ];
      for (let content of toc) {
        $("nav").append($("<button>").addClass("btn btn-light btn-sm doc-tab").text(content[0]).attr("data-page", String(content[1])));
      }
      $(".doc-tab").click(async function() {
          const page = $(this).data("page");
          const iframe = $("iframe")[0];
          iframe.src = "";
          await new Promise(r => setTimeout(r, 100));
          iframe.src = `rules.pdf#page=${page}`;
      });
    </script>
  </body>
</html>
